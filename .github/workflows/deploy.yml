name: Build & deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Third-party actions pinned by full commit SHA — tags are mutable and a
      # retargeted tag runs arbitrary code inside a contents:write job
      # (tj-actions/changed-files incident, CVE-2025-30066).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Astro caches processed images in node_modules/.astro; restore after
      # npm ci (which replaces node_modules) so unchanged photos skip
      # re-encoding. Saved back automatically at job end.
      - name: Restore Astro image cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules/.astro
          key: astro-images-${{ runner.os }}-${{ hashFiles('src/assets/**', 'package-lock.json') }}
          restore-keys: |
            astro-images-${{ runner.os }}-

      # type + content-schema gate, then build for the /furniture-demo base
      - run: npm run check
      - run: npm run build
        env:
          DEPLOY_TARGET: gh-pages
          PUBLIC_FORM_ACCESS_KEY: ${{ secrets.PUBLIC_FORM_ACCESS_KEY }}

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          force_orphan: true
